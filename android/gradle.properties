org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Kotlin incremental compile breaks on Windows when the project and Pub cache live on
# different drive letters (e.g. E:\…\atelier vs C:\Users\…\Pub\Cache): "different roots".
kotlin.incremental=false
