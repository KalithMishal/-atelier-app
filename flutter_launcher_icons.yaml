# After you save your logo as assets/branding/app_icon.png (1024×1024 PNG), run:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/app_icon.png"
  min_sdk_android: 21
  # Optional: uncomment for Android 13+ adaptive icon (needs a foreground PNG with transparency).
  # adaptive_icon_background: "#080808"
  # adaptive_icon_foreground: "assets/branding/app_icon_foreground.png"
